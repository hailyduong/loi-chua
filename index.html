<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhận Lời Chúa</title>
<meta name="description" content="Mỗi ngày một Lời Chúa chữa lành và hy vọng">
<meta name="theme-color" content="#8a5a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhận Lời Chúa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf6ef; --card:#fffdf8; --text:#3b2f25; --muted:#8c7a68; --accent:#8a5a2b; --accent-text:#fff; --chip:#efe6d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1814; --card:#26211c; --text:#efe6da; --muted:#a8998a; --accent:#c8904f; --accent-text:#1c1814; --chip:#332b24; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:-apple-system, system-ui, sans-serif; display:flex; flex-direction:column; align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  h1 { font-family:Lora, serif; font-weight:500; color:var(--accent); margin:0; font-size:1.6rem; }
  .icon-btn { background:none; border:0; font-size:1rem; color:var(--muted); padding:8px; cursor:pointer; }
  .card { position:relative; background:var(--card); border-radius:20px; padding:28px 24px 24px; width:100%; max-width:560px;
    min-height:240px; display:flex; flex-direction:column; justify-content:center;
    box-shadow:0 4px 24px rgba(0,0,0,.06); transition:opacity .35s ease; }
  .card.fade { opacity:0; }
  .hint { color:var(--muted); text-align:center; font-size:1.1rem; line-height:1.6; margin:0; }
  .verse { font-family:Lora, serif; font-style:italic; font-size:1.3rem; line-height:1.6; margin:0; }
  .ref { margin-top:14px; text-align:right; color:var(--accent); font-weight:600; }
  .fav { position:absolute; top:12px; right:12px; font-size:1.5rem; color:var(--accent); }
  .actions { display:flex; flex-direction:column; gap:10px; width:100%; max-width:560px; margin-top:20px; }
  .row { display:flex; gap:10px; }
  .row button { flex:1; background:var(--chip); color:var(--text); font-size:1rem; padding:12px; }
  button { font:inherit; border:0; border-radius:14px; cursor:pointer; }
  #get { background:var(--accent); color:var(--accent-text); padding:18px; font-size:1.2rem; font-weight:600; }
  #get:active { transform:scale(.98); }
  #favList { width:100%; max-width:560px; }
  #favList .item { background:var(--card); border-radius:14px; padding:16px; margin-bottom:10px; }
  #favList .item p { font-family:Lora, serif; font-style:italic; margin:0 0 8px; line-height:1.5; }
  #favList .item div { display:flex; justify-content:space-between; color:var(--accent); font-weight:600; }
  #favList .item button { background:none; color:var(--muted); font-size:.9rem; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Nhận Lời Chúa</h1>
  <button class="icon-btn" id="favToggle">♥ Đã lưu</button>
</header>

<main id="home">
  <div class="card" id="card"></div>
  <div class="actions">
    <button id="get">Xin Lời Chúa</button>
    <div class="row" id="shareRow" hidden>
      <button id="share">Gửi hình</button>
      <button id="copy">Sao chép</button>
    </div>
  </div>
</main>

<section id="favList" hidden></section>

<script>
const VERSES = [
  ["Phải, Ta sẽ phục thuốc cho ngươi, các thương tích của ngươi, Ta sẽ chữa lành – sấm ngôn của ĐỨC CHÚA.", "Giê-rê-mi-a 30:17"],
  ["Chính người đã bị đâm vì chúng ta phạm tội, bị nghiền nát vì chúng ta lỗi lầm; người đã chịu sửa trị để chúng ta được bình an, đã phải mang thương tích cho chúng ta được chữa lành.", "I-sai-a 53:5"],
  ["Người chữa trị bao cõi lòng tan vỡ, những vết thương, băng bó cho lành.", "Thánh Vịnh 147:3"],
  ["Vì Ta là ĐỨC CHÚA, Đấng chữa lành ngươi.", "Xuất Hành 15:26"],
  ["Tất cả những ai đang vất vả mang gánh nặng nề, hãy đến cùng tôi, tôi sẽ cho nghỉ ngơi bồi dưỡng.", "Mát-thêu 11:28"],
  ["Anh em đừng lo lắng gì cả, nhưng trong mọi hoàn cảnh, anh em cứ đem lời cầu khẩn, van xin và tạ ơn, mà giãi bày trước mặt Thiên Chúa những điều anh em thỉnh nguyện. Và bình an của Thiên Chúa là bình an vượt lên trên mọi hiểu biết, sẽ giữ cho lòng trí anh em được kết hợp với Đức Ki-tô Giê-su.", "Phi-líp-phê 4:6-7"],
  ["Anh thân mến, tôi cầu chúc anh được mọi bề thịnh đạt: thể xác mạnh khoẻ và tinh thần phấn chấn.", "3 Gio-an 1:2"],
  ["Chúc tụng CHÚA đi, hồn tôi hỡi, chớ khá quên mọi ân huệ của Người. CHÚA tha cho ngươi muôn ngàn tội lỗi, thương chữa lành các bệnh tật ngươi.", "Thánh Vịnh 103:2-3"],
  ["Lạy ĐỨC CHÚA, xin chữa lành con, để con được chữa lành, xin cứu thoát con, để con được cứu thoát, vì vinh dự của con chính là Ngài!", "Giê-rê-mi-a 17:14"],
  ["Người ban sức mạnh cho ai mệt mỏi, kẻ kiệt lực, Người làm cho nên cường tráng.", "I-sai-a 40:29"],
  ["Nhưng những người cậy trông ĐỨC CHÚA thì được thêm sức mạnh. Như thể chim bằng, họ tung cánh. Họ chạy hoài mà không mỏi mệt, và đi mãi mà chẳng chùn chân.", "I-sai-a 40:31"],
  ["Đừng sợ hãi: có Ta ở với ngươi. Đừng nhớn nhác: Ta là Thiên Chúa của ngươi. Ta cho ngươi vững mạnh, Ta lại còn trợ giúp với tay hữu toàn thắng của Ta.", "I-sai-a 41:10"],
  ["Thầy để lại bình an cho anh em, Thầy ban cho anh em bình an của Thầy. Thầy ban cho anh em không theo kiểu thế gian. Anh em đừng xao xuyến cũng đừng sợ hãi.", "Gio-an 14:27"],
  ["Lời cầu nguyện do lòng tin sẽ cứu người bệnh; người ấy được Chúa nâng dậy, và nếu người ấy đã phạm tội, thì sẽ được Chúa thứ tha.", "Gia-cô-bê 5:15"],
  ["Tội lỗi của chúng ta, chính Người đã mang vào thân thể mà đưa lên cây thập giá, để một khi đã chết đối với tội, chúng ta sống cuộc đời công chính. Vì Người phải mang những vết thương mà anh em đã được chữa lành.", "1 Phê-rô 2:24"],
  ["Mọi âu lo, hãy trút cả cho Người, vì Người chăm sóc anh em.", "1 Phê-rô 5:7"],
  ["CHÚA là mục tử chăn dắt tôi, tôi chẳng thiếu thốn gì. Trong đồng cỏ xanh tươi, Người cho tôi nằm nghỉ. Người đưa tôi tới dòng nước trong lành và bổ sức cho tôi.", "Thánh Vịnh 23:1-3"],
  ["Lạy Chúa, dầu qua lũng âm u con sợ gì nguy khốn, vì có Chúa ở cùng. Côn trượng Ngài bảo vệ, con vững dạ an tâm.", "Thánh Vịnh 23:4"],
  ["Thiên Chúa là nơi ta ẩn náu, là sức mạnh của ta. Người luôn luôn sẵn sàng giúp đỡ khi ta phải ngặt nghèo.", "Thánh Vịnh 46:2"],
  ["CHÚA gần gũi những tấm lòng tan vỡ, cứu những tâm thần thất vọng ê chề.", "Thánh Vịnh 34:19"],
  ["Người công chính gặp nhiều nỗi gian truân, nhưng CHÚA giúp họ luôn thoát khỏi.", "Thánh Vịnh 34:20"],
  ["Hãy trút nhẹ gánh lo vào tay CHÚA, Người sẽ đỡ đần cho, chẳng để chính nhân phải nghiêng ngửa bao giờ.", "Thánh Vịnh 55:23"],
  ["Người nổi giận, giận trong giây lát, nhưng yêu thương, thương suốt cả đời. Lệ có rơi khi màn đêm buông xuống, hừng đông về đã vọng tiếng hò reo.", "Thánh Vịnh 30:6"],
  ["Dẫu cho hồn xác suy tàn, thì nơi ẩn náu, kỷ phần lòng con, muôn đời là Chúa cao tôn.", "Thánh Vịnh 73:26"],
  ["Sai lời Người đến, chữa cho lành mạnh, cứu họ khỏi sa vào hố sâu.", "Thánh Vịnh 107:20"],
  ["Hãy hết lòng tin tưởng vào ĐỨC CHÚA, chớ hề cậy dựa vào hiểu biết của con. Hãy nhận biết Người trong mọi đường đi nước bước, Người sẽ san bằng đường nẻo con đi.", "Châm Ngôn 3:5-6"],
  ["Tâm trí hân hoan làm thân xác lành mạnh, tinh thần suy sụp khiến xương cốt rã rời.", "Châm Ngôn 17:22"],
  ["Lời tử tế là tảng mật ong làm cổ họng ngọt ngào, khiến xương cốt lành mạnh.", "Châm Ngôn 16:24"],
  ["Nhưng đối với các ngươi là những kẻ kính sợ Danh Ta, mặt trời công chính sẽ mọc lên, mang theo các tia sáng chữa lành bệnh.", "Ma-la-khi 3:20"],
  ["Vì chính Ta biết các kế hoạch Ta định làm cho các ngươi – sấm ngôn của ĐỨC CHÚA –, kế hoạch thịnh vượng, chứ không phải tai ương, để các ngươi có một tương lai và một niềm hy vọng.", "Giê-rê-mi-a 29:11"],
  ["Lượng từ bi ĐỨC CHÚA đâu đã cạn, lòng thương xót của Người mãi không vơi. Sáng nào Người cũng ban ân huệ mới. Lòng trung tín của Người cao cả biết bao!", "Ai Ca 3:22-23"],
  ["Chúng ta biết rằng: Thiên Chúa làm cho mọi sự đều sinh lợi ích cho những ai yêu mến Người, tức là cho những kẻ được Người kêu gọi theo như ý Người định.", "Rô-ma 8:28"],
  ["Ta sẽ không bỏ rơi ngươi, Ta sẽ không ruồng bỏ ngươi!", "Híp-ri 13:5"],
  ["Ơn của Thầy đã đủ cho anh, vì sức mạnh của Thầy được biểu lộ trọn vẹn trong sự yếu đuối.", "2 Cô-rin-tô 12:9"],
  ["Với Đấng ban sức mạnh cho tôi, tôi chịu được hết.", "Phi-líp-phê 4:13"],
  ["Thế rồi Đức Giê-su đi khắp miền Ga-li-lê, giảng dạy trong các hội đường, rao giảng Tin Mừng Nước Trời, và chữa hết mọi kẻ bệnh hoạn tật nguyền trong dân.", "Mát-thêu 4:23"],
  ["Này con, lòng tin của con đã cứu chữa con. Con hãy về bình an và khỏi hẳn bệnh.", "Mác-cô 5:34"],
  ["Đức Giê-su Ki-tô vẫn là một, hôm qua cũng như hôm nay, và như vậy mãi đến muôn đời.", "Híp-ri 13:8"],
  ["Nếu dân Ta, dân vốn kêu cầu Danh Ta, mà biết hạ mình xuống khẩn nguyện và tìm kiếm Nhan Ta, từ bỏ những con đường xấu xa mà trở lại, thì Ta, từ trời, Ta sẽ nghe và thứ tha tội lỗi nó và sẽ phục hưng xứ sở của nó.", "2 Sử Biên Niên 7:14"],
  ["Nguyện ĐỨC CHÚA chúc lành và gìn giữ anh (em)! Nguyện ĐỨC CHÚA tươi nét mặt nhìn đến anh (em) và rủ lòng thương anh (em)! Nguyện ĐỨC CHÚA ghé mắt nhìn và ban bình an cho anh (em)!", "Dân Số 6:24-26"],
  ["Hỡi ai nương tựa Đấng Tối Cao và núp bóng Đấng quyền năng tuyệt đối, hãy thưa với CHÚA rằng: \"Lạy Thiên Chúa, Ngài là nơi con náu ẩn, là đồn luỹ chở che, con tin tưởng vào Ngài.\"", "Thánh Vịnh 91:1-2"],
  ["Dừng tay lại: Hãy biết Ta đây là Thiên Chúa!", "Thánh Vịnh 46:11"],
  ["Lạy Chúa, Ngài quyết giữ cho dân được an cư lạc nghiệp, vì họ tin vào Ngài.", "I-sai-a 26:3"],
  ["Ta sẽ ban tặng các ngươi một quả tim mới, sẽ đặt thần khí mới vào lòng các ngươi. Ta sẽ bỏ đi quả tim bằng đá khỏi thân mình các ngươi và sẽ ban tặng các ngươi một quả tim bằng thịt.", "Ê-dê-ki-en 36:26"],
  ["Thiên Chúa yêu thế gian đến nỗi đã ban Con Một, để ai tin vào Con của Người thì khỏi phải chết, nhưng được sống muôn đời.", "Gio-an 3:16"],
  ["Phần tôi, tôi đến để cho chiên được sống và sống dồi dào.", "Gio-an 10:10"],
  ["Anh em sẽ lo buồn, nhưng nỗi buồn của anh em sẽ trở thành niềm vui.", "Gio-an 16:20"],
  ["Thầy nói với anh em những điều ấy, để trong Thầy anh em được bình an. Trong thế gian, anh em sẽ phải gian nan khốn khó. Nhưng can đảm lên! Thầy đã thắng thế gian.", "Gio-an 16:33"],
  ["Chính Thầy là sự sống lại và là sự sống. Ai tin vào Thầy, thì dù đã chết, cũng sẽ được sống.", "Gio-an 11:25"],
  ["Thiên Chúa sẽ lau sạch nước mắt họ. Sẽ không còn sự chết; cũng chẳng còn tang tóc, kêu than và đau khổ nữa, vì những điều cũ đã biến mất.", "Khải Huyền 21:4"],
  ["Này đây Ta đổi mới mọi sự.", "Khải Huyền 21:5"],
  ["Xin Thiên Chúa là nguồn hy vọng, ban cho anh em được chan chứa niềm vui và bình an nhờ đức tin, để nhờ quyền năng của Thánh Thần, anh em được tràn trề hy vọng.", "Rô-ma 15:13"],
  ["Tôi tin chắc rằng: cho dầu là sự chết hay sự sống, thiên thần hay ma vương quỷ lực, hiện tại hay tương lai, hoặc bất cứ sức mạnh nào, trời cao hay vực thẳm hay bất cứ một loài thụ tạo nào khác, không có gì tách được chúng ta ra khỏi tình yêu của Thiên Chúa thể hiện nơi Đức Ki-tô Giê-su, Chúa chúng ta.", "Rô-ma 8:38-39"],
  ["Có Thiên Chúa bênh đỡ chúng ta, ai còn chống lại được chúng ta?", "Rô-ma 8:31"],
  ["Trông cậy như thế, chúng ta sẽ không phải thất vọng, vì Thiên Chúa đã đổ tình yêu của Người vào lòng chúng ta, nhờ Thánh Thần mà Người ban cho chúng ta.", "Rô-ma 5:5"],
  ["Hãy vui mừng vì có niềm hy vọng, cứ kiên nhẫn lúc gặp gian truân, và chuyên cần cầu nguyện.", "Rô-ma 12:12"],
  ["Chúc tụng Thiên Chúa là Thân Phụ Đức Giê-su Ki-tô, Chúa chúng ta. Người là Cha giàu lòng từ bi lân ái, và là Thiên Chúa hằng sẵn sàng nâng đỡ ủi an. Người luôn nâng đỡ ủi an chúng ta trong mọi cơn gian nan thử thách…", "2 Cô-rin-tô 1:3-4"],
  ["Chúng tôi bị dồn ép tư bề, nhưng không bị đè bẹp; hoang mang, nhưng không tuyệt vọng; bị ngược đãi, nhưng không bị bỏ rơi; bị quật ngã, nhưng không bị tiêu diệt.", "2 Cô-rin-tô 4:8-9"],
  ["Cho nên chúng tôi không chán nản. Trái lại, dù con người bên ngoài của chúng tôi có tiêu tan đi, thì con người bên trong của chúng tôi ngày càng đổi mới.", "2 Cô-rin-tô 4:16"],
  ["Phàm ai ở trong Đức Ki-tô đều là thụ tạo mới. Cái cũ đã qua, và cái mới đã có đây rồi.", "2 Cô-rin-tô 5:17"],
  ["Tôi tin chắc rằng: Đấng đã bắt đầu thực hiện nơi anh em một công việc tốt lành như thế, cũng sẽ đưa công việc đó tới chỗ hoàn thành cho đến ngày Đức Ki-tô Giê-su quang lâm.", "Phi-líp-phê 1:6"],
  ["Xin tôn vinh Đấng có thể dùng quyền năng đang hoạt động nơi chúng ta, mà làm gấp ngàn lần điều chúng ta dám cầu xin hay nghĩ tới…", "Ê-phê-xô 3:20"],
  ["Vì Thiên Chúa đã chẳng ban cho chúng ta một thần khí làm cho chúng ta trở nên nhút nhát, nhưng là một Thần Khí khiến chúng ta được đầy sức mạnh, tình thương, và biết tự chủ.", "2 Ti-mô-thê 1:7"],
  ["Ta hãy mạnh dạn tiến lại gần ngai Thiên Chúa là nguồn ân sủng, để được xót thương và lãnh ơn trợ giúp mỗi khi cần.", "Híp-ri 4:16"],
  ["Đức tin là bảo đảm cho những điều ta hy vọng, là bằng chứng cho những điều ta không thấy.", "Híp-ri 11:1"],
  ["Hãy đến gần Thiên Chúa, Người sẽ đến gần anh em.", "Gia-cô-bê 4:8"],

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const MIXPANEL_TOKEN = '1c351f7868ec8ed80eed639cde3195e1';
const queued = [];
function track(event, props) {
  if (window.mixpanel && mixpanel.__loaded) mixpanel.track(event, props);
  else queued.push([event, props]);
}
(function loadMixpanel() {
  // The CDN build expects the official snippet's stub: it replays mixpanel._i once loaded.
  const stub = window.mixpanel = [];
  stub.__SV = 1.2;
  stub._i = [];
  stub.init = (token, config, name) => stub._i.push([token, config, name || 'mixpanel']);
  stub.init(MIXPANEL_TOKEN, {
    track_pageview: false,
    persistence: 'localStorage',
    loaded: mp => queued.splice(0).forEach(([e, p]) => mp.track(e, p)),
  });
  const s = document.createElement('script');
  s.src = 'https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js';
  s.async = true;
  document.head.append(s);
})();

const $ = id => document.getElementById(id);
let favs = store.get('favs', []);
let current = null, last = -1;

function showIntro() {
  $('card').innerHTML = '<p class="hint">Hãy dành một phút thinh lặng, cầu nguyện, mở lòng và ấn nút dưới đây để nhận Lời Chúa 🙏</p>';
}

function render(i) {
  current = i;
  $('shareRow').hidden = false;
  const v = VERSES[i], card = $('card');
  card.classList.add('fade');
  setTimeout(() => {
    card.innerHTML = '';
    const fav = document.createElement('button');
    fav.className = 'icon-btn fav'; fav.setAttribute('aria-label', 'Lưu câu này');
    fav.textContent = favs.includes(v[1]) ? '♥' : '♡';
    fav.onclick = () => toggleFav(v[1], fav);
    const p = document.createElement('p'); p.className = 'verse'; p.textContent = '“' + v[0] + '”';
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = v[1];
    card.append(fav, p, r);
    card.classList.remove('fade');
  }, card.childElementCount ? 350 : 0);
}

function toggleFav(ref, btn) {
  const saved = !favs.includes(ref);
  favs = saved ? [ref, ...favs] : favs.filter(r => r !== ref);
  store.set('favs', favs);
  track('verse_favorited', { verse_ref: ref, saved });
  if (btn) btn.textContent = favs.includes(ref) ? '♥' : '♡';
}

function next() {
  let i;
  do { i = Math.floor(Math.random() * VERSES.length); } while (i === last);
  last = i;
  render(i);
  track('verse_requested', { verse_ref: VERSES[i][1] });
}

function verseText(i) { return '“' + VERSES[i][0] + '” (' + VERSES[i][1] + ')'; }

function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  lines.push(line); return lines;
}

async function makeImage(i) {
  await document.fonts.ready;
  const W = 1080, H = 1350, pad = 110, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fbf3e4'); g.addColorStop(1, '#ecd9bb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(W / 2 - 6, 120, 12, 90); ctx.fillRect(W / 2 - 34, 145, 68, 12);
  let size = 58, lines;
  do { ctx.font = `italic 500 ${size}px Lora, Georgia, serif`; lines = wrap(ctx, '“' + VERSES[i][0] + '”', W - pad * 2); size -= 2; }
  while (lines.length * size * 1.5 > H - 520 && size > 30);
  const lh = (size + 2) * 1.5, top = (H - lines.length * lh) / 2 + 20;
  ctx.fillStyle = '#3b2f25'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((ln, k) => ctx.fillText(ln, W / 2, top + k * lh));
  ctx.font = '600 44px -apple-system, system-ui, sans-serif'; ctx.fillStyle = '#8a5a2b';
  ctx.fillText(VERSES[i][1], W / 2, top + lines.length * lh + 40);
  ctx.font = '500 32px Lora, Georgia, serif'; ctx.fillStyle = '#8c7a68';
  ctx.fillText('Nhận Lời Chúa · ' + location.host + location.pathname, W / 2, H - 100);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

$('get').onclick = next;

$('copy').onclick = async () => {
  if (current == null) return;
  track('verse_shared', { verse_ref: VERSES[current][1], method: 'copy' });
  try { await navigator.clipboard.writeText(verseText(current)); $('copy').textContent = 'Đã sao chép ✓'; }
  catch { prompt('Sao chép câu này:', verseText(current)); }
  setTimeout(() => $('copy').textContent = 'Sao chép', 1500);
};

$('share').onclick = async () => {
  if (current == null) return;
  const btn = $('share'); btn.textContent = 'Đang tạo hình…';
  track('verse_shared', { verse_ref: VERSES[current][1], method: 'image' });
  try {
    const blob = await makeImage(current);
    const file = new File([blob], 'loi-chua.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: verseText(current) });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'loi-chua.png'; a.click();
    }
  } catch {}
  btn.textContent = 'Gửi hình';
};

$('favToggle').onclick = () => {
  const list = $('favList'), showing = !list.hidden;
  list.hidden = showing; $('home').hidden = !showing;
  $('favToggle').textContent = showing ? '♥ Đã lưu' : '← Quay lại';
  if (!showing) renderFavs();
  else if (current != null) render(current);
};

function renderFavs() {
  const list = $('favList'); list.innerHTML = '';
  const items = favs.map(ref => VERSES.findIndex(v => v[1] === ref)).filter(i => i >= 0);
  if (!items.length) { list.innerHTML = '<p class="empty">Chưa có câu nào. Bấm ♡ trên câu Lời Chúa để lưu lại.</p>'; return; }
  for (const i of items) {
    const d = document.createElement('div'); d.className = 'item';
    const p = document.createElement('p'); p.textContent = '“' + VERSES[i][0] + '”';
    const row = document.createElement('div');
    const r = document.createElement('span'); r.textContent = VERSES[i][1];
    const rm = document.createElement('button'); rm.textContent = 'Bỏ lưu';
    rm.onclick = () => { toggleFav(VERSES[i][1]); renderFavs(); };
    row.append(r, rm); d.append(p, row); list.append(d);
  }
}

showIntro();
track('app_opened', {
  standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  site: location.host,
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
