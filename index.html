<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lời Chúa</title>
<meta name="description" content="Bấm nút để nhận một câu Lời Chúa chữa lành">
<meta name="theme-color" content="#8a5a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lời Chúa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf6ef; --card:#fffdf8; --text:#3b2f25; --muted:#8c7a68; --accent:#8a5a2b; --accent-text:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1814; --card:#26211c; --text:#efe6da; --muted:#a8998a; --accent:#c8904f; --accent-text:#1c1814; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:-apple-system, system-ui, sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-family:Lora, serif; font-weight:500; color:var(--accent); margin:0 0 24px; font-size:1.6rem; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; width:100%; max-width:560px;
    min-height:220px; display:flex; flex-direction:column; justify-content:center;
    box-shadow:0 4px 24px rgba(0,0,0,.06); transition:opacity .35s ease; }
  .card.fade { opacity:0; }
  .verse { font-family:Lora, serif; font-style:italic; font-size:1.35rem; line-height:1.6; margin:0; }
  .ref { margin-top:16px; text-align:right; color:var(--accent); font-weight:600; }
  .hint { color:var(--muted); text-align:center; font-size:1.1rem; }
  .actions { display:flex; flex-direction:column; gap:12px; width:100%; max-width:560px; margin-top:24px; }
  button { font:inherit; border:0; border-radius:14px; padding:18px; font-size:1.2rem; font-weight:600; cursor:pointer; }
  #get { background:var(--accent); color:var(--accent-text); }
  #get:active { transform:scale(.98); }
  #copy { background:transparent; color:var(--muted); font-size:1rem; padding:10px; }
  #copy[hidden] { display:none; }
</style>
</head>
<body>
<h1>Lời Chúa</h1>
<div class="card" id="card"><p class="hint">Hãy tĩnh lặng một chút, rồi bấm nút bên dưới 🙏</p></div>
<div class="actions">
  <button id="get">Lấy lời Chúa</button>
  <button id="copy" hidden>Sao chép để gửi</button>
</div>
<script>
const VERSES = [
  ["Chính Ta sẽ làm cho vết thương ngươi lành lặn, sẽ chữa ngươi khỏi mọi thương tích – sấm ngôn của ĐỨC CHÚA.", "Giê-rê-mi-a 30:17"],
  ["Chính Người đã bị đâm vì chúng ta phạm tội, bị nghiền nát vì chúng ta lỗi lầm; Người đã chịu sửa trị để chúng ta được bình an, đã phải mang thương tích cho chúng ta được chữa lành.", "I-sai-a 53:5"],
  ["Người chữa trị những tấm lòng tan vỡ, những vết thương đau, Người băng bó cho.", "Thánh Vịnh 147:3"],
  ["Ta là ĐỨC CHÚA, Đấng chữa lành ngươi.", "Xuất Hành 15:26"],
  ["Tất cả những ai đang vất vả mang gánh nặng nề, hãy đến cùng tôi, tôi sẽ cho anh em được nghỉ ngơi bồi dưỡng.", "Mát-thêu 11:28"],
  ["Anh em đừng lo lắng gì cả. Nhưng trong mọi hoàn cảnh, anh em cứ đem lời cầu khẩn, van xin và tạ ơn, mà giãi bày trước mặt Thiên Chúa những điều anh em thỉnh nguyện. Và bình an của Thiên Chúa, bình an vượt lên trên mọi hiểu biết, sẽ giữ cho lòng trí anh em được kết hợp với Đức Ki-tô Giê-su.", "Phi-líp-phê 4:6-7"],
  ["Anh thân mến, tôi cầu chúc cho anh được thịnh đạt về mọi mặt và được khoẻ mạnh, như linh hồn anh vẫn thịnh đạt.", "3 Gio-an 1:2"],
  ["Chúc tụng CHÚA đi, hồn tôi hỡi, chớ khá quên mọi ân huệ của Người. Chúa tha cho ngươi muôn vàn tội lỗi, thương chữa lành các bệnh tật ngươi.", "Thánh Vịnh 103:2-3"],
  ["Lạy ĐỨC CHÚA, xin chữa con, cho con được lành, xin cứu con, cho con được thoát, vì chính Ngài là Đấng con ca tụng.", "Giê-rê-mi-a 17:14"],
  ["Người ban sức mạnh cho ai mệt mỏi rã rời, người kiệt lực, Người làm cho nên cường tráng.", "I-sai-a 40:29"],
  ["Nhưng những ai cậy trông ĐỨC CHÚA thì được thêm sức mạnh. Như thể chim bằng, họ tung cánh. Họ chạy hoài mà không mỏi mệt, và đi mãi mà chẳng chùn chân.", "I-sai-a 40:31"],
  ["Đừng sợ, vì có Ta ở với ngươi. Đừng nhớn nhác, vì Ta là Thiên Chúa ngươi. Ta cho ngươi vững mạnh, Ta phù trợ ngươi, Ta sẽ lấy tay phải chiến thắng mà nâng đỡ ngươi.", "I-sai-a 41:10"],
  ["Thầy để lại bình an cho anh em, Thầy ban cho anh em bình an của Thầy. Thầy ban cho anh em không theo kiểu thế gian. Lòng anh em đừng xao xuyến cũng đừng sợ hãi.", "Gio-an 14:27"],
  ["Lời cầu nguyện do lòng tin sẽ cứu người bệnh; người ấy được Chúa nâng dậy.", "Gia-cô-bê 5:15"],
  ["Tội lỗi của chúng ta, chính Người đã mang vào thân thể mà đưa lên cây thập giá, để một khi đã chết đối với tội, chúng ta sống cuộc đời công chính. Vì Người phải mang những vết thương mà anh em đã được chữa lành.", "1 Phê-rô 2:24"],
  ["Mọi lo âu, anh em hãy trút cả cho Người, vì Người chăm sóc anh em.", "1 Phê-rô 5:7"],
  ["CHÚA là mục tử chăn dắt tôi, tôi chẳng thiếu thốn gì. Trên đồng cỏ xanh rì, Người cho tôi nằm nghỉ. Người đưa tôi tới dòng nước trong lành và bổ sức cho tôi.", "Thánh Vịnh 23:1-3"],
  ["Lạy Chúa, dầu qua lũng âm u con sợ gì nguy khốn, vì có Chúa ở cùng.", "Thánh Vịnh 23:4"],
  ["Thiên Chúa là nơi ẩn náu, là sức mạnh của chúng ta, Đấng hằng phù trợ lúc ngặt nghèo.", "Thánh Vịnh 46:2"],
  ["CHÚA gần gũi những tấm lòng tan vỡ, cứu những tâm thần thất vọng ê chề.", "Thánh Vịnh 34:19"],
  ["Người công chính gặp nhiều nỗi gian truân, nhưng CHÚA giúp họ luôn luôn thoát khỏi.", "Thánh Vịnh 34:20"],
  ["Trút gánh nặng của ngươi cho CHÚA, Người sẽ đỡ nâng ngươi.", "Thánh Vịnh 55:23"],
  ["Lệ có rơi khi màn đêm buông xuống, hừng đông về đã vọng tiếng hò reo.", "Thánh Vịnh 30:6"],
  ["Tấm thân này, cõi lòng này dù tiêu tan, nhưng Thiên Chúa vẫn là Núi Đá cho lòng con, là phần sản nghiệp con đến muôn đời.", "Thánh Vịnh 73:26"],
  ["Người sai lời Người đến chữa lành, cứu họ thoát khỏi mồ sâu.", "Thánh Vịnh 107:20"],
  ["Hãy hết lòng tin tưởng vào ĐỨC CHÚA, chớ hề cậy vào sự hiểu biết của con. Hãy nhận biết Người trong mọi đường đi nước bước, Người sẽ san bằng các lối con đi.", "Châm Ngôn 3:5-6"],
  ["Lòng vui tươi là phương thuốc tốt, tinh thần sa sút làm xương cốt khô héo.", "Châm Ngôn 17:22"],
  ["Lời êm dịu là tảng mật ong, ngọt ngào cho tâm hồn, bổ dưỡng cho thân xác.", "Châm Ngôn 16:24"],
  ["Còn với các ngươi, những kẻ kính sợ danh Ta, mặt trời công chính sẽ mọc lên, mang theo ơn chữa lành trong tia sáng.", "Ma-la-khi 3:20"],
  ["Chính Ta biết các kế hoạch Ta định làm cho các ngươi – sấm ngôn của ĐỨC CHÚA –, đó là kế hoạch thịnh vượng chứ không phải tai ương, để mang lại cho các ngươi một tương lai và một niềm hy vọng.", "Giê-rê-mi-a 29:11"],
  ["Tình thương của ĐỨC CHÚA đâu đã hết, lòng thương xót của Người đâu đã cạn! Mỗi sáng, chúng lại mới tinh.", "Ai Ca 3:22-23"],
  ["Chúng ta biết rằng: Thiên Chúa làm cho mọi sự đều sinh lợi ích cho những ai yêu mến Người.", "Rô-ma 8:28"],
  ["Ta sẽ không bỏ rơi ngươi, Ta sẽ không bỏ mặc ngươi.", "Híp-ri 13:5"],
  ["Ơn của Thầy đã đủ cho anh, vì sức mạnh của Thầy được biểu lộ trọn vẹn trong sự yếu đuối.", "2 Cô-rin-tô 12:9"],
  ["Tôi chịu được hết, nhờ Đấng ban sức mạnh cho tôi.", "Phi-líp-phê 4:13"],
  ["Đức Giê-su đi khắp miền Ga-li-lê, giảng dạy trong các hội đường, rao giảng Tin Mừng Nước Trời, và chữa hết các bệnh hoạn tật nguyền trong dân.", "Mát-thêu 4:23"],
  ["Này con, lòng tin của con đã cứu chữa con. Con hãy về bình an và khỏi hẳn bệnh.", "Mác-cô 5:34"],
  ["Đức Giê-su Ki-tô vẫn là một, hôm qua cũng như hôm nay, và như vậy mãi đến muôn đời.", "Híp-ri 13:8"],
  ["Nếu dân Ta, dân được gọi theo danh Ta, hạ mình xuống cầu nguyện, tìm kiếm Tôn Nhan Ta và từ bỏ đường lối xấu xa của chúng, thì Ta, từ trời cao, sẽ nghe, sẽ tha tội cho chúng, và chữa lành xứ sở của chúng.", "2 Sử Biên Niên 7:14"],
  ["Nguyện ĐỨC CHÚA chúc lành và gìn giữ anh em! Nguyện ĐỨC CHÚA tươi nét mặt nhìn đến anh em và dủ lòng thương anh em! Nguyện ĐỨC CHÚA ghé mắt nhìn và ban bình an cho anh em!", "Dân Số 6:24-26"],
  ["Ai núp dưới bóng Đấng Tối Cao và nương mình bên Thiên Chúa Toàn Năng, hãy thưa cùng CHÚA: \"Chúa là nơi con trú ẩn, là đồn luỹ chở che, là Thiên Chúa con tin cậy\".", "Thánh Vịnh 91:1-2"],
  ["Dừng tay lại! Hãy nhận biết chính Ta là Thiên Chúa.", "Thánh Vịnh 46:11"],
  ["Người có tâm hồn kiên định, Ngài gìn giữ cho được bình an, bình an vì người ấy tin tưởng nơi Ngài.", "I-sai-a 26:3"],
  ["Ta sẽ ban tặng các ngươi một quả tim mới, sẽ đặt thần khí mới vào lòng các ngươi.", "Ê-dê-ki-en 36:26"],
  ["Thiên Chúa yêu thế gian đến nỗi đã ban Con Một, để ai tin vào Con của Người thì khỏi phải chết, nhưng được sống muôn đời.", "Gio-an 3:16"],
  ["Tôi đến để cho chiên được sống và sống dồi dào.", "Gio-an 10:10"],
  ["Anh em sẽ phải lo âu, nhưng nỗi lo âu của anh em sẽ trở thành niềm vui.", "Gio-an 16:20"],
  ["Trong thế gian, anh em sẽ phải gian nan khốn khó. Nhưng can đảm lên! Thầy đã thắng thế gian.", "Gio-an 16:33"],
  ["Chính Thầy là sự sống lại và là sự sống. Ai tin vào Thầy, thì dù đã chết, cũng sẽ được sống.", "Gio-an 11:25"],
  ["Người sẽ lau sạch nước mắt họ. Sẽ không còn sự chết; cũng chẳng còn tang tóc, kêu than và đau khổ nữa, vì những điều cũ đã biến mất.", "Khải Huyền 21:4"],
  ["Này đây Ta đổi mới mọi sự.", "Khải Huyền 21:5"],
  ["Xin Thiên Chúa là nguồn hy vọng, ban cho anh em được chan chứa niềm vui và bình an nhờ đức tin, để nhờ quyền năng của Thánh Thần, anh em được tràn trề hy vọng.", "Rô-ma 15:13"],
  ["Tôi tin chắc rằng: cho dù là sự chết hay sự sống, thiên thần hay ma vương quỷ lực, hiện tại hay tương lai, hoặc bất cứ sức mạnh nào, trời cao hay vực thẳm hay bất cứ một loài thụ tạo nào khác, không có gì tách được chúng ta ra khỏi tình yêu của Thiên Chúa thể hiện nơi Đức Ki-tô Giê-su, Chúa chúng ta.", "Rô-ma 8:38-39"],
  ["Nếu Thiên Chúa có mặt bênh đỡ chúng ta, ai còn chống lại được chúng ta?", "Rô-ma 8:31"],
  ["Và trông cậy như thế, chúng ta sẽ không phải thất vọng, vì Thiên Chúa đã đổ tình yêu của Người vào lòng chúng ta, nhờ Thánh Thần mà Người ban cho chúng ta.", "Rô-ma 5:5"],
  ["Hãy vui mừng vì có niềm hy vọng, cứ kiên nhẫn lúc gặp gian truân, và chuyên cần cầu nguyện.", "Rô-ma 12:12"],
  ["Chúc tụng Thiên Chúa là Cha Đức Giê-su Ki-tô Chúa chúng ta, là Cha giàu lòng từ bi lân mẫn, và là Thiên Chúa hằng sẵn sàng nâng đỡ ủi an. Người luôn nâng đỡ ủi an chúng ta trong mọi cơn gian nan thử thách.", "2 Cô-rin-tô 1:3-4"],
  ["Chúng tôi bị dồn ép tứ phía, nhưng không bị đè bẹp; hoang mang, nhưng không tuyệt vọng; bị ngược đãi, nhưng không bị bỏ rơi; bị quật ngã, nhưng không bị tiêu diệt.", "2 Cô-rin-tô 4:8-9"],
  ["Vì thế, chúng ta không nản chí. Trái lại, dù con người bên ngoài của chúng ta có tàn tạ đi, thì con người bên trong của chúng ta cũng được đổi mới ngày này qua ngày khác.", "2 Cô-rin-tô 4:16"],
  ["Phàm ai ở trong Đức Ki-tô đều là thọ tạo mới. Cái cũ đã qua, và cái mới đã có đây rồi.", "2 Cô-rin-tô 5:17"],
  ["Tôi tin chắc rằng Đấng đã khởi sự công việc tốt lành nơi anh em, cũng sẽ đưa công việc đó tới chỗ hoàn thành.", "Phi-líp-phê 1:6"],
  ["Người là Đấng có thể thực hiện mọi sự vượt quá điều chúng ta dám cầu xin hay nghĩ tới, nhờ quyền năng đang hoạt động nơi chúng ta.", "Ê-phê-xô 3:20"],
  ["Vì Thiên Chúa đã chẳng ban cho chúng ta một thần khí làm cho chúng ta trở nên nhút nhát, nhưng là một Thần Khí khiến chúng ta được đầy sức mạnh, tình thương, và biết tự chủ.", "2 Ti-mô-thê 1:7"],
  ["Vậy, chúng ta hãy mạnh dạn tiến đến ngai Thiên Chúa là nguồn ân sủng, để được xót thương và lãnh ơn trợ giúp mỗi khi cần.", "Híp-ri 4:16"],
  ["Đức tin là bảo đảm cho những điều ta hy vọng, là bằng chứng cho những điều ta không thấy.", "Híp-ri 11:1"],
  ["Hãy đến gần Thiên Chúa, và Thiên Chúa sẽ đến gần anh em.", "Gia-cô-bê 4:8"],
  ["Anh em có ai đau yếu ư? Người ấy hãy mời các kỳ mục của Hội Thánh đến; họ sẽ cầu nguyện cho người ấy, sau khi xức dầu nhân danh Chúa.", "Gia-cô-bê 5:14"],
  ["Anh em hãy thú tội với nhau và cầu nguyện cho nhau để được cứu thoát. Lời cầu xin tha thiết của người công chính rất có sức thuyết phục.", "Gia-cô-bê 5:16"],
  ["Trong tình yêu không có sợ hãi; trái lại, tình yêu hoàn hảo loại trừ sợ hãi.", "1 Gio-an 4:18"],
  ["Nếu chúng ta thú nhận tội lỗi, Thiên Chúa là Đấng trung thành và công chính sẽ tha tội cho chúng ta, và sẽ tẩy sạch mọi điều bất chính khỏi chúng ta.", "1 Gio-an 1:9"],
  ["Thưa Ngài, tôi chẳng đáng Ngài vào nhà tôi, nhưng xin Ngài chỉ nói một lời là đầy tớ tôi sẽ được khỏi bệnh.", "Mát-thêu 8:8"],
  ["Người đã mang lấy các tật nguyền của ta và gánh lấy các bệnh hoạn của ta.", "Mát-thêu 8:17"],
  ["Thưa Ngài, nếu Ngài muốn, Ngài có thể làm cho tôi được sạch. Đức Giê-su giơ tay đụng vào anh và bảo: \"Tôi muốn, anh hãy được sạch.\"", "Mát-thêu 8:2-3"],
  ["Chỉ cần tôi sờ được vào áo choàng của Người thôi là tôi sẽ được cứu.", "Mát-thêu 9:21"],
  ["Người thấy đám đông thì chạnh lòng thương, vì họ lầm than vất vưởng, như bầy chiên không người chăn dắt.", "Mát-thêu 9:36"],
  ["Hãy cứ xin thì sẽ được, cứ tìm thì sẽ thấy, cứ gõ cửa thì sẽ mở cho.", "Mát-thêu 7:7"],
  ["Vậy anh em đừng lo lắng về ngày mai: ngày mai, cứ để ngày mai lo. Ngày nào có cái khổ của ngày ấy.", "Mát-thêu 6:34"],

const card = document.getElementById('card');
const getBtn = document.getElementById('get');
const copyBtn = document.getElementById('copy');
let last = -1, current = null;

getBtn.addEventListener('click', () => {
  let i;
  do { i = Math.floor(Math.random() * VERSES.length); } while (i === last && VERSES.length > 1);
  last = i;
  current = VERSES[i];
  card.classList.add('fade');
  setTimeout(() => {
    card.innerHTML = '';
    const p = document.createElement('p'); p.className = 'verse'; p.textContent = '“' + current[0] + '”';
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = current[1];
    card.append(p, r);
    card.classList.remove('fade');
    copyBtn.hidden = false;
    copyBtn.textContent = 'Sao chép để gửi';
  }, 350);
});

copyBtn.addEventListener('click', async () => {
  if (!current) return;
  const text = '“' + current[0] + '” (' + current[1] + ')';
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = 'Đã sao chép ✓';
  } catch (e) {}
});
</script>
